<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 1300 140'
    style='background-color: #00000000;'
    width='1300px' height='140px'>

    <!-- No font embedding needed for monospace -->

    <path id='path0'>
        <!-- Multiline -->
        <animate id='d0' attributeName='d' begin='0s'
            dur='4300ms' fill="freeze"
            values='m0,55 h0 ; m0,55 h0 ; m0,55 h1300 ; m0,55 h1300' 
            keyTimes='0;0;0.93023255813953;1' />
    </path>
    <text font-family='monospace' fill='#925EA6' font-size='50'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            welcome...
        </textPath>
    </text>
    
    <path id='path1'>
        <!-- Multiline -->
        <animate id='d1' attributeName='d' begin='0s'
            dur='8600ms' fill="freeze"
            values='m0,110 h0 ; m0,110 h0 ; m0,110 h1300 ; m0,110 h1300' 
            keyTimes='0;0.5;0.96511627906977;1' />
    </path>
    <text font-family='monospace' fill='#925EA6' font-size='50'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            i'm ethan, a tech enthusiast and cs student
        </textPath>
    </text>
</svg>
