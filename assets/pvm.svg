<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <!-- Text glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
 
    <!-- Screen ambient glow -->
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
 
    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="800" height="4">
      <rect width="800" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>
 
    <!-- CRT screen curvature vignette -->
    <radialGradient id="screenCurve" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="75%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
    </radialGradient>
 
    <!-- PVM body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="40%" stop-color="#3e3e3e"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
 
    <!-- Right panel gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#383838"/>
    </linearGradient>
 
    <!-- Knob gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#383838"/>
    </radialGradient>
 
    <!-- Screen reflection -->
    <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
 
    <!-- Power LED -->
    <radialGradient id="ledGreen" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#5f5"/>
      <stop offset="50%" stop-color="#0d0"/>
      <stop offset="100%" stop-color="#080"/>
    </radialGradient>
 
    <!-- Welcome text gradient -->
    <linearGradient id="welcomeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
 
    <!-- Clip paths for typing reveal -->
    <clipPath id="typeLine1">
      <rect x="110" y="82" width="0" height="28">
        <animate attributeName="width" from="0" to="198" begin="0.5s" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
 
    <clipPath id="typeLine3">
      <rect x="110" y="138" width="0" height="28">
        <animate attributeName="width" from="0" to="162" begin="3.5s" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
 
    <!-- Screen clip -->
    <clipPath id="screenClip">
      <rect x="90" y="42" width="500" height="370" rx="4"/>
    </clipPath>
  </defs>
 
  <!-- ========== PVM BODY ========== -->
 
  <!-- Shadow under monitor -->
  <ellipse cx="400" cy="522" rx="310" ry="10" fill="rgba(0,0,0,0.2)"/>
 
  <!-- Main body -->
  <rect x="55" y="10" width="690" height="505" rx="8" fill="url(#bodyGrad)" stroke="#505050" stroke-width="1.5"/>
 
  <!-- Top edge highlight -->
  <line x1="63" y1="11" x2="737" y2="11" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
 
  <!-- ========== SCREEN AREA ========== -->
 
  <!-- Screen bezel -->
  <rect x="78" y="30" width="525" height="392" rx="6" fill="#1a1a1a" stroke="#111" stroke-width="1"/>
 
  <!-- Inner bezel shadow (top) -->
  <rect x="78" y="30" width="525" height="6" rx="3" fill="rgba(0,0,0,0.4)"/>
 
  <!-- CRT Screen -->
  <rect x="90" y="42" width="500" height="370" rx="4" fill="#0d1117"/>
 
  <!-- ========== TERMINAL CONTENT ========== -->
  <g clip-path="url(#screenClip)">
 
    <!-- Terminal title bar -->
    <rect x="98" y="50" width="484" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <circle cx="110" cy="61" r="4" fill="#ff5f57" opacity="0.85"/>
    <circle cx="122" cy="61" r="4" fill="#febc2e" opacity="0.85"/>
    <circle cx="134" cy="61" r="4" fill="#28c840" opacity="0.85"/>
    <text x="340" y="65" text-anchor="middle" fill="#8b949e" font-family="'Courier New', monospace" font-size="10">user@sony-pvm: ~</text>
 
    <!-- Terminal body -->
    <rect x="98" y="74" width="484" height="330" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
 
    <!-- Line 1: typed command (revealed by clipPath) -->
    <g clip-path="url(#typeLine1)">
      <text y="100" font-family="'Courier New', monospace" font-size="15">
        <tspan x="110" fill="#79c0ff">$</tspan>
        <tspan fill="#c9d1d9"> echo </tspan>
        <tspan fill="#ffa657">"hello world"</tspan>
      </text>
    </g>
 
    <!-- Line 2: command output (appears after typing) -->
    <text x="110" y="124" fill="#c9d1d9" font-family="'Courier New', monospace" font-size="15" opacity="0">
      hello world
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.15s" fill="freeze"/>
    </text>
 
    <!-- Line 3: typed command (revealed by clipPath) -->
    <g clip-path="url(#typeLine3)">
      <text y="158" font-family="'Courier New', monospace" font-size="15">
        <tspan x="110" fill="#79c0ff">$</tspan>
        <tspan fill="#c9d1d9"> cat welcome.txt</tspan>
      </text>
    </g>
 
    <!-- Welcome box (appears after cat command) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.0s" dur="0.4s" fill="freeze"/>
 
      <!-- Box -->
      <rect x="110" y="180" width="400" height="88" rx="6" fill="rgba(56,139,253,0.04)" stroke="#30363d" stroke-width="1"/>
 
      <!-- Box header -->
      <rect x="110" y="180" width="400" height="22" rx="6" fill="rgba(56,139,253,0.08)"/>
      <rect x="110" y="196" width="400" height="6" fill="rgba(56,139,253,0.08)"/>
      <text x="126" y="196" fill="#58a6ff" font-family="'Courier New', monospace" font-size="11">welcome.txt</text>
 
      <!-- Separator -->
      <line x1="110" y1="202" x2="510" y2="202" stroke="#30363d" stroke-width="0.5"/>
 
      <!-- Welcome message with gradient -->
      <text x="140" y="244" fill="url(#welcomeGrad)" font-family="'Courier New', monospace" font-size="18" font-weight="bold" filter="url(#glow)">
        welcome to my github
      </text>
    </g>
 
    <!-- Final prompt -->
    <text x="110" y="298" fill="#79c0ff" font-family="'Courier New', monospace" font-size="15" opacity="0">
      $
      <animate attributeName="opacity" from="0" to="1" begin="6.5s" dur="0.1s" fill="freeze"/>
    </text>
 
    <!-- ========== TYPING CURSOR ========== -->
    <rect x="110" y="87" width="9" height="15" fill="#c9d1d9">
      <!-- X position follows typing -->
      <animate attributeName="x" dur="9s" fill="freeze"
        values="110;110;308;308;110;110;272;272;128;128"
        keyTimes="0;0.056;0.278;0.367;0.378;0.389;0.611;0.711;0.722;1"/>
      <!-- Y position jumps between lines -->
      <animate attributeName="y" dur="9s" fill="freeze"
        values="87;87;87;87;145;145;145;145;285;285"
        keyTimes="0;0.056;0.278;0.367;0.378;0.389;0.611;0.711;0.722;1"/>
      <!-- Blink -->
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
 
    <!-- ========== CRT EFFECTS ========== -->
 
    <!-- Scanlines -->
    <rect x="90" y="42" width="500" height="370" fill="url(#scanlines)" opacity="0.45"/>
 
    <!-- CRT refresh line (slow scroll) -->
    <rect x="90" y="42" width="500" height="2" fill="rgba(255,255,255,0.02)">
      <animate attributeName="y" from="42" to="412" dur="6s" repeatCount="indefinite"/>
    </rect>
 
    <!-- Screen curvature vignette -->
    <rect x="90" y="42" width="500" height="370" rx="4" fill="url(#screenCurve)"/>
 
    <!-- Screen reflection -->
    <rect x="90" y="42" width="500" height="370" rx="4" fill="url(#reflection)"/>
  </g>
 
  <!-- Screen edge ambient glow -->
  <rect x="90" y="42" width="500" height="370" rx="4" fill="none" stroke="rgba(56,139,253,0.12)" stroke-width="2" filter="url(#screenGlow)">
    <animate attributeName="stroke-opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/>
  </rect>
 
  <!-- ========== RIGHT CONTROL PANEL ========== -->
 
  <rect x="613" y="30" width="120" height="392" rx="6" fill="url(#panelGrad)" stroke="#505050" stroke-width="0.5"/>
 
  <!-- SONY logo -->
  <text x="673" y="60" text-anchor="middle" fill="#aaa" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" letter-spacing="4">SONY</text>
  <line x1="630" y1="70" x2="716" y2="70" stroke="#555" stroke-width="0.5"/>
 
  <!-- INPUT SELECT section -->
  <text x="673" y="88" text-anchor="middle" fill="#777" font-family="'Arial', sans-serif" font-size="7.5" letter-spacing="1.5">INPUT SELECT</text>
 
  <rect x="630" y="96" width="38" height="15" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>
  <text x="649" y="107" text-anchor="middle" fill="#999" font-family="'Arial', sans-serif" font-size="7">INP A</text>
 
  <rect x="678" y="96" width="38" height="15" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>
  <text x="697" y="107" text-anchor="middle" fill="#999" font-family="'Arial', sans-serif" font-size="7">INP B</text>
 
  <line x1="630" y1="122" x2="716" y2="122" stroke="#444" stroke-width="0.5"/>
 
  <!-- MONITOR section -->
  <text x="673" y="138" text-anchor="middle" fill="#777" font-family="'Arial', sans-serif" font-size="7.5" letter-spacing="1.5">MONITOR</text>
 
  <rect x="625" y="146" width="30" height="13" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>
  <text x="640" y="155.5" text-anchor="middle" fill="#69b3ff" font-family="'Arial', sans-serif" font-size="6">BLUE</text>
 
  <rect x="660" y="146" width="34" height="13" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>
  <text x="677" y="155.5" text-anchor="middle" fill="#999" font-family="'Arial', sans-serif" font-size="6">USCAN</text>
 
  <rect x="699" y="146" width="32" height="13" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>
  <text x="715" y="155.5" text-anchor="middle" fill="#999" font-family="'Arial', sans-serif" font-size="6">MONO</text>
 
  <line x1="630" y1="170" x2="716" y2="170" stroke="#444" stroke-width="0.5"/>
 
  <!-- ADJUST section -->
  <text x="673" y="186" text-anchor="middle" fill="#777" font-family="'Arial', sans-serif" font-size="7.5" letter-spacing="1.5">ADJUST</text>
 
  <!-- CHROMA knob -->
  <circle cx="648" cy="210" r="14" fill="url(#knobGrad)" stroke="#222" stroke-width="1.5"/>
  <circle cx="648" cy="210" r="9" fill="#484848" stroke="#333" stroke-width="0.5"/>
  <line x1="648" y1="201" x2="648" y2="210" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="648" y="232" text-anchor="middle" fill="#666" font-family="'Arial', sans-serif" font-size="6.5">CHROMA</text>
 
  <!-- PHASE knob -->
  <circle cx="698" cy="210" r="14" fill="url(#knobGrad)" stroke="#222" stroke-width="1.5"/>
  <circle cx="698" cy="210" r="9" fill="#484848" stroke="#333" stroke-width="0.5"/>
  <line x1="698" y1="201" x2="698" y2="210" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="698" y="232" text-anchor="middle" fill="#666" font-family="'Arial', sans-serif" font-size="6.5">PHASE</text>
 
  <!-- BRIGHT knob -->
  <circle cx="648" cy="264" r="14" fill="url(#knobGrad)" stroke="#222" stroke-width="1.5"/>
  <circle cx="648" cy="264" r="9" fill="#484848" stroke="#333" stroke-width="0.5"/>
  <line x1="648" y1="255" x2="648" y2="264" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="648" y="286" text-anchor="middle" fill="#666" font-family="'Arial', sans-serif" font-size="6.5">BRIGHT</text>
 
  <!-- CONTRAST knob -->
  <circle cx="698" cy="264" r="14" fill="url(#knobGrad)" stroke="#222" stroke-width="1.5"/>
  <circle cx="698" cy="264" r="9" fill="#484848" stroke="#333" stroke-width="0.5"/>
  <line x1="693" y1="257" x2="698" y2="264" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="698" y="286" text-anchor="middle" fill="#666" font-family="'Arial', sans-serif" font-size="6.5">CONTR</text>
 
  <line x1="630" y1="298" x2="716" y2="298" stroke="#444" stroke-width="0.5"/>
 
  <!-- APERTURE knob -->
  <circle cx="648" cy="322" r="12" fill="url(#knobGrad)" stroke="#222" stroke-width="1"/>
  <circle cx="648" cy="322" r="8" fill="#484848" stroke="#333" stroke-width="0.5"/>
  <line x1="648" y1="314" x2="648" y2="322" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="648" y="342" text-anchor="middle" fill="#666" font-family="'Arial', sans-serif" font-size="6.5">APER</text>
 
  <!-- H/V DLY button -->
  <rect x="682" y="314" width="36" height="13" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.5"/>
  <text x="700" y="323.5" text-anchor="middle" fill="#999" font-family="'Arial', sans-serif" font-size="6">H/V DLY</text>
 
  <line x1="630" y1="354" x2="716" y2="354" stroke="#444" stroke-width="0.5"/>
 
  <!-- Power section -->
  <circle cx="648" cy="378" r="4" fill="url(#ledGreen)" stroke="#060" stroke-width="0.5">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="648" y="392" text-anchor="middle" fill="#666" font-family="'Arial', sans-serif" font-size="6.5">POWER</text>
 
  <!-- Power button -->
  <rect x="682" y="370" width="36" height="15" rx="2" fill="#2a2a2a" stroke="#666" stroke-width="1"/>
  <circle cx="700" cy="377.5" r="4" fill="none" stroke="#999" stroke-width="0.8"/>
  <line x1="700" y1="373.5" x2="700" y2="376.5" stroke="#999" stroke-width="0.8"/>
 
  <!-- ========== BOTTOM BRANDING ========== -->
 
  <!-- Model number -->
  <text x="90" y="445" fill="#999" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" letter-spacing="1">PVM-20M2</text>
 
  <!-- HR TRINITRON badge -->
  <rect x="82" y="458" width="118" height="18" rx="2" fill="none" stroke="#999" stroke-width="0.8"/>
  <text x="141" y="471" text-anchor="middle" fill="#bbb" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" letter-spacing="2">HR TRINITRON</text>
 
  <!-- Professional Video Monitor label -->
  <text x="82" y="498" fill="#555" font-family="'Arial', sans-serif" font-size="7.5" letter-spacing="2.5">PROFESSIONAL VIDEO MONITOR</text>
 
  <!-- Ventilation slots -->
  <g stroke="#444" stroke-width="0.7">
    <line x1="350" y1="448" x2="395" y2="448"/>
    <line x1="405" y1="448" x2="450" y2="448"/>
    <line x1="460" y1="448" x2="505" y2="448"/>
    <line x1="515" y1="448" x2="560" y2="448"/>
    <line x1="350" y1="454" x2="395" y2="454"/>
    <line x1="405" y1="454" x2="450" y2="454"/>
    <line x1="460" y1="454" x2="505" y2="454"/>
    <line x1="515" y1="454" x2="560" y2="454"/>
    <line x1="350" y1="460" x2="395" y2="460"/>
    <line x1="405" y1="460" x2="450" y2="460"/>
    <line x1="460" y1="460" x2="505" y2="460"/>
    <line x1="515" y1="460" x2="560" y2="460"/>
  </g>
 
</svg>
